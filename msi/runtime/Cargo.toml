[package]
name = "msi-runtime"
version = "0.1.0"
edition = "2021"
description = "MSI v1.0 userspace runtime for ninjamagicOS — FFI bridge to /dev/msi kernel module"
license = "Apache-2.0"

[lib]
name = "msi"
path = "src/lib.rs"

[[bin]]
name = "msi-probe"
path = "src/bin/probe.rs"

[dependencies]
nix = { version = "0.29", features = ["ioctl", "fs"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
