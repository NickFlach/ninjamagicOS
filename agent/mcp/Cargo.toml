[package]
name = "ninjamagic-mcp"
version = "0.1.0"
edition = "2021"
description = "NinjaMagic MCP Server — exposes phone capabilities as MCP tools and resources"
license = "Apache-2.0"

[lib]
name = "ninjamagic_mcp"
path = "src/lib.rs"

[[bin]]
name = "ninjamagic-mcp-server"
path = "src/main.rs"

[dependencies]
msi = { path = "../../msi/runtime" }
ninjamagic-agent = { path = "../core" }
ninjamagic-telephony = { path = "../../radio/telephony" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
