[package]
name = "ninjamagic-agent"
version = "0.1.0"
edition = "2021"
description = "NinjaMagic Agent — always-on AI assistant for ninjamagicOS, running as a native MSI lane"
license = "Apache-2.0"

[lib]
name = "ninjamagic_agent"
path = "src/lib.rs"

[[bin]]
name = "ninjamagic-agent"
path = "src/main.rs"

[dependencies]
msi = { path = "../../msi/runtime" }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
opt-level = "z"
lto = true
strip = true
